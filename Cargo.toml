[package]
name = "iroh-bun"
version = "1.3.0"
edition = "2026"
description = "Thin napi-rs wrapper around iroh 1.3 — QUIC p2p endpoints, connections and bi-streams, usable from Node and Bun"
license = "0BSD"

[lib]
crate-type = ["cdylib"]

[dependencies]
# napi 2.x is the battle-tested line; the #[napi] macro API is identical on 3.x if
# you choose to bump. `tokio_rt` gives async #[napi] fns a shared tokio runtime,
# which iroh also runs on. `napi6` covers class instances + Buffer/Uint8Array.
napi = { version = "2", default-features = false, features = ["napi6", "tokio_rt"] }
napi-derive = "2"

# iroh 1.x — the QUIC p2p stack. Discovery and relay (used by `presets::N0` and
# dial-by-id) are not feature-gated. Default features add `metrics`, `portmapper`
# (UPnP/NAT-PMP, helps direct connections behind NATs), `fast-apple-datapath`
# and `tls-ring`. Turning them off (`default-features = false, features =
# ["tls-ring"]`) saves only ~0.8 MB on top of the release profile below and
# loses port mapping, so we keep them.
iroh = "1.3"

tokio = { version = "1", features = ["sync", "io-util"] }
hex = "0.4"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
# Optimize for size: this is a thin I/O wrapper where network latency dominates,
# so the speed difference vs opt-level 2/3 is negligible, while the binary shrinks
# ~36% (Linux x64, iroh 1.3.0: 10.4 MiB -> 6.7 MiB with codegen-units = 1).
opt-level = "z"
# One codegen unit lets LLVM optimize (and dedupe) across the whole crate; slower
# to compile, smaller output.
codegen-units = 1
# Debug symbols are dead weight in a published prebuilt .node.
strip = true
