[package]
name = "iroh-bun"
version = "1.0.0"
edition = "2026"
description = "Thin napi-rs wrapper around iroh 1.0 — QUIC p2p endpoints, connections and bi-streams, usable from Node and Bun"
license = "0BSD"

[lib]
crate-type = ["cdylib"]

[dependencies]
# napi 2.x is the battle-tested line; the #[napi] macro API is identical on 3.x if
# you choose to bump. `tokio_rt` gives async #[napi] fns a shared tokio runtime,
# which iroh also runs on. `napi6` covers class instances + Buffer/Uint8Array.
napi = { version = "2", default-features = false, features = ["napi6", "tokio_rt"] }
napi-derive = "2"

# iroh 1.0 — the QUIC p2p stack. Keep default features on for the native build:
# they pull in n0 discovery + relay support, which `presets::N0` and dial-by-id
# rely on. (The `default-features = false` advice is for the size-constrained
# wasm/browser build only — not relevant here.)
iroh = "1.0"

tokio = { version = "1", features = ["sync", "io-util"] }
hex = "0.4"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
# iroh pulls in a large dependency tree; opt-level 2 keeps compile time saner than 3
# for negligible runtime difference in a thin I/O wrapper.
opt-level = 2
# Ship a stripped artifact (~11.5 MB vs ~13.7 MB unstripped); debug symbols are
# dead weight in a published prebuilt .node.
strip = true
